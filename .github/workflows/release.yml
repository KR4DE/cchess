name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and package / ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 10

    strategy:
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
            cmake_args: >-
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Windows
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          ${{ matrix.os.cmake_args }}

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        working-directory: build
        run: cpack -C Release

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os.runner }}
          path: |
            build/cchess-*.tar.gz
            build/cchess-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: List packages
        run: ls -l dist

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "CChess ${GITHUB_REF_NAME#v}"
